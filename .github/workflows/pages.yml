name: Publish personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate publications and build
        env:
          WEBSITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build.py --site-url "$WEBSITE_BASE_URL"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
